name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build the interface
        working-directory: frontend
        run: npm run build

      - name: Interface tests
        working-directory: frontend
        run: npm test

      - name: Rust tests
        working-directory: frontend/src-tauri
        run: cargo test
